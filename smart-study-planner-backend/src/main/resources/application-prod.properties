# Production startup profile.
# Allows the app to start and pass the health check even if the DB is
# temporarily unreachable, so [DB-ENV] diagnostic logs reach production.
# HikariCP will still attempt connections at request time.
# Once the DATABASE_URL source is confirmed, Flyway can be re-enabled.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none

# Prevent Hibernate from fetching JDBC metadata on startup (disabled Neon endpoint)
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.jakarta.persistence.database-product-name=PostgreSQL
spring.jpa.properties.jakarta.persistence.database-major-version=14
spring.jpa.properties.jakarta.persistence.database-minor-version=0

# Lazy init so Tomcat opens port before DB connects
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy
